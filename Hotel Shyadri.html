    function subscribeToSupabaseRealtime() {

      try {
        sbClient.channel('public:hotel_orders')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'hotel_orders' }, payload => {
            if (payload.eventType === 'INSERT') {
              const exists = ordersList.some(o => o.id === payload.new.id);
              if (!exists) {
                ordersList.unshift(payload.new);
                playHotelChime();
                toast(`🔔 New Order from Room ${payload.new.room_number}!`);

              const idx = ordersList.findIndex(o => o.id === payload.new.id);
              if (idx !== -1) ordersList[idx] = payload.new;
              else ordersList.unshift(payload.new);
            } else if (payload.eventType === 'DELETE') {
              ordersList = ordersList.filter(o => o.id !== payload.old.id);
            }
            try { localStorage.setItem('shyadri_orders', JSON.stringify(ordersList)); }catch(e){}

    // Web Audio Synthesizer: 2-Tone Hotel Chime
    function playHotelChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        
        // Tone 1
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now); // D5
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.6);

        // Tone 2
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, now + 0.25); // A5
        gain2.gain.setValueAtTime(0.3, now + 0.25);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.25);
        osc2.stop(now + 1.1);
      } catch(e){}
    }

    function updateCartQty(id, delta) {
      const item = cart.find(c => c.id === id);

        if (item.qty <= 0) {
          cart = cart.filter(c => c.id !== id);
        }

      render();

    async function submitOrder(viaWhatsApp = false, viaSMS = false) {

        return;
      }
      if (!cart.length) {

      guestRoomNumber = room;

      localStorage.setItem('shyadri_room', room);
      localStorage.setItem('shyadri_guest_name', name);
      localStorage.setItem('shyadri_guest_phone', phone);

      // Determine order type

      const hasToiletries = cart.some(i => i.type === 'toiletries');
      const hasCustom = cart.some(i => i.type === 'custom');
      let orderType = 'food';
      if (hasFood && (hasToiletries || hasCustom)) orderType = 'mixed';
      else if (hasToiletries && !hasFood) orderType = 'toiletries';
      else if (hasCustom && !hasFood && !hasToiletries) orderType = 'custom';

        extra_note: note,
        total_price: getCartTotal(),
        status: 'received',
        created_at: new Date().toISOString()
      };

      // 1. Save to local state
      ordersList.unshift(newOrder);
      try { localStorage.setItem('shyadri_orders', JSON.stringify(ordersList)); }catch(e){}

      // 2. Save to Supabase Cloud Database if connected
      if (sbClient) {
        try {
          sbClient.from('hotel_orders').insert([{
            order_code: newOrder.id,
            room_number: newOrder.room_number,
            guest_name: newOrder.guest_name,
            guest_phone: newOrder.guest_phone,
            order_type: newOrder.order_type,
            items: newOrder.items,
            extra_note: newOrder.extra_note,
            total_price: newOrder.total_price,
            status: newOrder.status
          }]).then();
        } catch(e){}

      // 3. Handle WhatsApp & SMS simultaneous triggers
      const links = buildOrderWhatsAppMessage(newOrder);
      if (viaWhatsApp) {
        window.open(links.url, '_blank');

            window.open(links.url, '_blank');
          }
        }, 400);

      // Reset cart

      showCartModal = false;
      playHotelChime();
      toast('🎉 Order placed successfully!');
      
      // Navigate to Track Page so the customer can track their order!
      currentView = 'track';
      render();

    async function promptUpdateOrderStatus(orderId, newStatus) {
      const order = ordersList.find(o => o.id === orderId);

    async function applyOrderStatus(orderId, newStatus) {
      const idx = ordersList.findIndex(o => o.id === orderId);
      if (idx !== -1) {
        ordersList[idx].status = newStatus;
        if (newStatus === 'accepted') ordersList[idx].accepted_at = new Date().toISOString();
        if (newStatus === 'delivered') ordersList[idx].completed_at = new Date().toISOString();
        try { localStorage.setItem('shyadri_orders', JSON.stringify(ordersList)); }catch(e){}
      }

      // Update in Supabase
      if (sbClient) {
        try {
          sbClient
            .from('hotel_orders')
            .update({ 
              status: newStatus,
              accepted_at: newStatus === 'accepted' ? new Date().toISOString() : undefined,
              completed_at: newStatus === 'delivered' ? new Date().toISOString() : undefined
            })
            .eq('id', orderId).then();
        } catch(e){}
      }

      pendingVerifyOrder = null;
      toast(`Order updated to: ${newStatus.toUpperCase()}`);
      render();
    }

      if (!text) return;
      if (i) i.value = '';

      chat.push({ role: 'user', content: text });
      paintChat();

      // Show typing indicator
      chat.push({ role: 'assistant', content: 'Thinking…' });
      paintChat();

      // Check if external Claude sample is available, else use smart Hotel AI engine
      setTimeout(async () => {
        let reply = '';
        if (window.claude && typeof claude.use === 'function') {
          try {
            const ai = await claude.use('sample');
            if (ai) {
              const res = await ai([{ role: 'user', content: text }]);
              if (res) reply = res;
            }
          } catch(e){}
        }

        if (!reply) {
          reply = generateAssistantResponse(text);
        }

        chat[chat.length - 1].content = reply;
        paintChat();
      }, 350);
    }

              <button class="btn sm g" data-act="close_cart" style="padding:2px 10px;">✕</button>
            </div>

            <div style="max-height:220px; overflow-y:auto; margin:12px 0;">
              ${cart.length === 0 ? '<p class="mu">Your cart is empty.</p>' :
                cart.map(it => `
                  <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dotted rgba(255,247,234,.2);">
                    <div style="flex:1;">
                      <b>${esc(it.name)}</b>
                      <div class="mu" style="font-size:.8rem;">${it.price > 0 ? '₹' + it.price + ' each' : 'Complimentary'}</div>
                    </div>
                    <div class="qty-stepper">
                      <button data-act="cart_minus" data-id="${it.id}">−</button>
                      <span>${it.qty}</span>
                      <button data-act="cart_plus" data-id="${it.id}">+</button>
                    </div>
                  </div>
                `).join('')
              }
            </div>

            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.15rem; color:var(--oc); margin:10px 0;">
              <span>Total Price:</span>
              <span>₹${getCartTotal()}</span>
            </div>

            <!-- MANDATORY GUEST DETAILS FORM -->
            <div style="background:rgba(0,0,0,.2); padding:10px; border-radius:12px; margin-top:10px;">
              <label>🚪 Room Number (Required) *</label>
              <input id="order_room" type="text" placeholder="e.g. 104, 202, 301" value="${esc(guestRoomNumber)}" required autofocus>

              <label>👤 Guest Name (Required) *</label>
              <input id="order_name" type="text" placeholder="e.g. Rahul Patil" value="${esc(guestName)}" required>

              <label>📞 Mobile / WhatsApp Number (For updates)</label>
              <input id="order_phone" type="tel" placeholder="e.g. 9876543210" value="${esc(guestPhone)}">

              <label>📝 Extra Note / Special Instructions</label>
              <textarea id="order_note" rows="2" placeholder="e.g. Less spicy, deliver after 8:30 PM, knock gently"></textarea>
            </div>

            <!-- SUBMIT & SEND BUTTONS -->
            <div style="display:flex; flex-direction:column; gap:8px; margin-top:14px;">
              <button class="btn btn-full" data-act="do_submit_order">🛎️ Place Order to Hotel System</button>
              <div style="display:flex; gap:8px;">
                <button class="btn wa" style="flex:1;" data-act="do_submit_order_wa">📲 Order via WhatsApp</button>
                <button class="btn sms" style="flex:1;" data-act="do_submit_order_sms">💬 Order via SMS</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // MANDATORY REQUIREMENT: Verification Alert before accepting
    // "give a alert message in kitchen and hotel dashboard as check customer is present in the room before accepting the order"
    function verificationAlertModalView() {
      if (!pendingVerifyOrder) return '';
      const o = pendingVerifyOrder.order;
      return `
        <div class="modal">
          <div class="card alert-dialog" style="max-width:420px; text-align:center;">
            <div style="font-size:3rem; margin-bottom:4px;">⚠️</div>
            <h2 style="color:#ffcc80; margin-bottom:6px;">VERIFICATION REQUIRED</h2>
            <div style="background:#fff3e0; color:#5d4037; padding:12px; border-radius:12px; margin:10px 0; font-size:1.05rem; font-weight:800; border:2px dashed #ff9800;">
              Check customer is present in the room before accepting the order!
            </div>
            <p style="font-size:.9rem; color:var(--cream); margin:6px 0;">
              कृपया खात्री करा की पाहुणे खोलीत हजर आहेत.
            </p>
            <div style="background:rgba(0,0,0,.3); padding:8px; border-radius:8px; margin:10px 0; text-align:left; font-size:.92rem;">
              <div>🚪 <b>Room:</b> ${esc(o.room_number)}</div>
              <div>👤 <b>Guest:</b> ${esc(o.guest_name)}</div>
              <div>💰 <b>Total:</b> ₹${esc(o.total_price)}</div>
            </div>

            <div style="display:flex; gap:10px; margin-top:14px;">
              <button class="btn g" style="flex:1;" data-act="cancel_verify">Re-check / Cancel</button>
              <button class="btn accept" style="flex:1.4;" data-act="confirm_verify">✓ Yes, Customer Present - Accept</button>
            </div>
          </div>
        </div>
      `;
    }

    // Admin & Staff Protected Portal
    function adminView() {
      let content = '';

      if (adminSubView === 'kitchen') {
        content = kitchenView();
      } else if (adminSubView === 'hotel_dash') {
        content = hotelDashView();
      } else if (adminSubView === 'notices') {
        content = `
          <div class="card">
            <h2>Broadcast a Notice</h2>
            <textarea id="nt" rows="3" placeholder="Message for all guests, e.g. Dinner served until 10:30 PM."></textarea>
            <button class="btn" data-act="addnotice">Broadcast Now</button>
          </div>
          <div class="card">
            <h2>Live Notices</h2>
            ${S.notices.map((n, i) => `
              <div class="row">
                <p style="margin:0 0 6px">${esc(n.t)}</p>
                <small class="mu">${esc(n.time)}</small>
                <button class="btn d" data-act="delnotice" data-i="${i}">Remove Notice</button>
              </div>
            `).join('') || '<p class="mu">No active notices.</p>'}
          </div>
        `;
      } else if (adminSubView === 'menu_mgmt') {
        const c = S.menu[mcat];
        content = `
          <div class="card">
            <div class="pills">
              ${S.menu.map((x, i) => `<button class="pill ${i === mcat ? 'on' : ''}" data-act="acat" data-i="${i}">${esc(x.cat)}</button>`).join('')}
              <button class="pill" data-act="addcat">+ Category</button>
            </div>
            ${c ? `
              <label>Category Name</label>
              <input value="${esc(c.cat)}" data-k="menu.${mcat}.cat">
              ${c.items.map((it, j) => {
                const p = `menu.${mcat}.items.${j}.`;
                return `
                  <div class="row">
                    <input value="${esc(it.n)}" data-k="${p}n" placeholder="Dish name">
                    <input value="${esc(it.p)}" data-k="${p}p" placeholder="Price ₹">
                    <input value="${esc(it.d)}" data-k="${p}d" placeholder="Description">
                    <label><input type="checkbox" data-k="${p}v" ${it.v ? 'checked' : ''}>Veg</label>
                    <label><input type="checkbox" data-k="${p}a" ${it.a ? 'checked' : ''}>Available</label>
                    <button class="btn d" data-act="delitem" data-j="${j}">Delete</button>
                  </div>
                `;
              }).join('')}
              <div class="bar" style="margin-top:12px;">
                <button class="btn g" data-act="additem">+ Add Dish</button>
                <button class="btn d" data-act="delcat">Delete Category</button>
              </div>
            ` : '<p class="mu">No items.</p>'}
          </div>
        `;
      } else if (adminSubView === 'hotel_info') {
        content = `
          <div class="card">
            <h2>Hotel Contact & WhatsApp</h2>
            <label>Hotel Name</label>
            <input value="${esc(S.hotel.name)}" data-k="hotel.name">
            <label>Tagline</label>
            <input value="${esc(S.hotel.tagline)}" data-k="hotel.tagline">
            <label>Staff WhatsApp Number (for instant orders)</label>
            <input value="${esc(S.hotel.whatsapp)}" data-k="hotel.whatsapp" placeholder="+919876543210">
            <label>Reception Phone Number</label>
            <input value="${esc(S.hotel.phone)}" data-k="hotel.phone" placeholder="+919876543210">
            <label>WiFi Network Name</label>
            <input value="${esc(S.wifi.name)}" data-k="wifi.name">
            <label>WiFi Password</label>
            <input value="${esc(S.wifi.pass)}" data-k="wifi.pass">
            <label>Google Review URL</label>
            <input value="${esc(S.review)}" data-k="review">
          </div>
          <div class="card">
            <h2>House Rules</h2>
            ${S.rules.map((r, i) => `
              <div class="row">
                <input value="${esc(r)}" data-k="rules.${i}">
                <button class="btn d" data-act="delrule" data-i="${i}">Delete</button>
              </div>
            `).join('')}
            <button class="btn g" data-act="addrule">+ Add Rule</button>
          </div>
        `;
      } else if (adminSubView === 'db') {
        content = `
          <div class="card">
            <h2>⚡ Supabase Cloud Database</h2>
            <p class="mu" style="font-size:.9rem;">Connected Endpoint: <code>https://uvjqhfvxghtrvogdmzxz.supabase.co/rest/v1/</code></p>
            <div class="kv">
              <span class="mu">Cloud Sync</span>
              <b style="color:var(--ok);">● Active &amp; Ready</b>
            </div>
            <div class="kv" style="margin-top:8px;">
              <span class="mu">Total Orders Recorded</span>
              <b>${ordersList.length}</b>
            </div>
            <p style="font-size:.84rem; color:var(--cr2); margin-top:10px;">
              Guest room orders and status updates sync automatically in the background across devices.
            </p>
          </div>
        `;
      }

      return `
        <div class="wrap">
          <div class="bar">
            <div>
              <h2 style="margin:0">🔒 Staff &amp; Admin Portal</h2>
              <small class="mu">Hotel Shyadri Management</small>
            </div>
            <div>
              <button class="btn g" data-act="logout">Exit to Guest</button>
              <button class="btn" data-act="save_all">Save Changes</button>
            </div>
          </div>

          <!-- Protected Tabs inside Admin -->
          <div class="pills">
            <button class="pill ${adminSubView === 'kitchen' ? 'on' : ''}" data-act="admin_tab" data-t="kitchen">👨‍🍳 Kitchen Dash</button>
            <button class="pill ${adminSubView === 'hotel_dash' ? 'on' : ''}" data-act="admin_tab" data-t="hotel_dash">🏨 Staff Dash</button>
            <button class="pill ${adminSubView === 'notices' ? 'on' : ''}" data-act="admin_tab" data-t="notices">📢 Notices</button>
            <button class="pill ${adminSubView === 'menu_mgmt' ? 'on' : ''}" data-act="admin_tab" data-t="menu_mgmt">🍛 Menu</button>
            <button class="pill ${adminSubView === 'hotel_info' ? 'on' : ''}" data-act="admin_tab" data-t="hotel_info">⚙️ Info & WhatsApp</button>
            <button class="pill ${adminSubView === 'db' ? 'on' : ''}" data-act="admin_tab" data-t="db">⚡ Database</button>
          </div>

          ${content}
        </div>
      `;
    }

    // Main Render Function
    function render() {
      let mainHtml = '';
      if (admin) {
        mainHtml = adminView();
      } else if (currentView === 'track') {
        mainHtml = trackView();
      } else {
        mainHtml = guestView();
      }

      // Append Modals
      mainHtml += cartModalView();
      mainHtml += verificationAlertModalView();

      if (login) {
        mainHtml += `
          <div class="modal">
            <div class="card">
              <h2>Staff &amp; Admin Login</h2>
              <p class="mu" style="font-size:.85rem; margin-top:-6px;">Enter staff password to access Kitchen &amp; Hotel Dashboards.</p>
              <input id="pw" type="password" placeholder="Password (default: admin123)" autocomplete="current-password">
              <div class="st" id="lst" style="color:var(--err); min-height:1.2em; font-weight:700;"></div>
              <div class="bar">
                <button class="btn g" data-act="closelogin">Cancel</button>
                <button class="btn" data-act="dologin">Unlock</button>
              </div>
            </div>
          </div>
        `;
      }

      $('#app').innerHTML = mainHtml;
      reveal();
      const p = $('#pw');
      if (p) p.focus();
    }

    // Scroll reveal observer
    function reveal() {
      const e = document.querySelectorAll('.rv');
      if (!('IntersectionObserver' in window)) return e.forEach(x => x.classList.add('in'));
      const o = new IntersectionObserver(r => r.forEach(x => {
        if (x.isIntersecting) {
          x.target.classList.add('in');
          o.unobserve(x.target);
        }
      }), { threshold: .08 });
      e.forEach(x => o.observe(x));
    }

    // Toast alert helper
    function toast(m) {
      const d = document.createElement('div');
      d.className = 'toast';
      d.textContent = m;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 2200);
    }

    // Confetti Boom animation
    function boom(el) {
      const r = (el || document.body).getBoundingClientRect();
      const x = r.left + r.width / 2;
      const y = r.top + r.height / 2;
      const c = ['#f0b23e', '#fff7ea', '#86e0a3', '#ffd2c2', '#2a140b', '#25d366'];
      for (let i = 0; i < 24; i++) {
        const d = document.createElement('i');
        d.className = 'cf';
        d.style.cssText = `left:${x}px;top:${y}px;background:${c[i % c.length]};--dx:${(Math.random() - .5) * 280}px;--dy:${-80 - Math.random() * 180}px;--r:${Math.random() * 720}deg`;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 1200);
      }
    }

    // Recommendation Picker
    function pick(t) {
      const all = S.menu.flatMap(c => c.items).filter(i => i.a && (!vegOnly || i.v));
      const e = $('#pick');
      if (!all.length) {
        if (e) e.innerHTML = '<p class="mu">Nothing to pick right now 🙈</p>';
        return;
      }
      const it = all[Math.floor(Math.random() * all.length)];
      if (e) e.innerHTML = `
        <div style="background:var(--cream); color:var(--ink); border-radius:16px; padding:12px; margin:12px 0; animation:pop .4s; display:grid;">
          <small style="color:#7a4a35; font-weight:800;">🍛 आजचं खास सुचवणं (Today's Pick)</small>
          <b style="font-size:1.2rem; font-family:var(--d);">${esc(it.n)}</b>
          <span>${it.p ? '₹' + esc(it.p) + ' · ' : ''}${esc(it.d)}</span>
          <button class="btn sm" style="margin-top:8px; justify-self:start;" data-act="add_food" data-id="${it.id}">+ Add to Order</button>
        </div>
      `;
      boom(t);
    }

    // Event Handling
    document.addEventListener('input', e => {
      if (e.target.id === 'q') {
        q = e.target.value;
        const mm = $('#mm');
        if (mm) mm.innerHTML = menuBlock();
      }
      if (e.target.id === 'vg') {
        vegOnly = e.target.checked;
        const mm = $('#mm');
        if (mm) mm.innerHTML = menuBlock();
      }
      // Direct config bind
      const k = e.target.dataset && e.target.dataset.k;
      if (k) {
        const keys = k.split('.');
        let o = S;
        for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
        o[keys[keys.length - 1]] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (e.target.id === 'pw') act('dologin', e.target);
        if (e.target.id === 'cin') chatSend();
      }
    });

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (t) act(t.dataset.act, t);
    });

    // Central Action Dispatcher
    async function act(a, t) {
      const id = t.dataset.id;
      const i = +t.dataset.i;
      const j = +t.dataset.j;

      // Navigation & Tabs
      if (a === 'nav') {
        currentView = t.dataset.v;
        render();
      }
      else if (a === 'sub_tab') {
        currentView = 'guest';
        currentTab = t.dataset.tab;
        render();
      }
      else if (a === 'admin_tab') {
        adminSubView = t.dataset.t;
        render();
      }
      else if (a === 'cat') {
        mcat = i;
        const mm = $('#mm');
        if (mm) mm.innerHTML = menuBlock();
      }
      else if (a === 'acat') {
        mcat = i;
        render();
      }
      else if (a === 's_filter') {
        staffDashFilter = t.dataset.f;
        render();
      }

      // AI Chat Actions
      else if (a === 'chat') {
        chatToggle();
      }
      else if (a === 'send_chat') {
        chatSend();
      }
      else if (a === 'chip') {
        chatSend(t.dataset.q);
      }

      // Cart Actions
      else if (a === 'add_food') {
        const item = S.menu.flatMap(c => c.items).find(x => x.id === id);
        if (item) addToCart(item, 'food');
      }
      else if (a === 'add_toiletries') {
        const item = S.toiletries.find(x => x.id === id);
        if (item) addToCart(item, 'toiletries');
      }
      else if (a === 'add_custom_request') {
        addCustomRequest();
      }
      else if (a === 'cart_plus') {
        updateCartQty(id, 1);
      }
      else if (a === 'cart_minus') {
        updateCartQty(id, -1);
      }
      else if (a === 'open_cart') {
        showCartModal = true;
        render();
      }
      else if (a === 'close_cart') {
        showCartModal = false;
        render();
      }
      else if (a === 'do_submit_order') {
        submitOrder(false, false);
      }
      else if (a === 'do_submit_order_wa') {
        submitOrder(true, false);
      }
      else if (a === 'do_submit_order_sms') {
        submitOrder(false, true);
      }

      // Tracking Page actions
      else if (a === 'set_track_room') {
        const val = $('#track_room_input').value.trim();
        guestRoomNumber = val;
        localStorage.setItem('shyadri_room', val);
        render();
      }
      else if (a === 'refresh_orders') {
        if (sbClient) fetchSupabaseOrders();
        toast('Board refreshed ✓');
        render();
      }

      // Verification Alert Modal Actions
      else if (a === 'verify_accept') {
        promptUpdateOrderStatus(id, 'accepted');
      }
      else if (a === 'confirm_verify') {
        if (pendingVerifyOrder) {
          await applyOrderStatus(pendingVerifyOrder.orderId, pendingVerifyOrder.newStatus);
        }
      }
      else if (a === 'cancel_verify') {
        pendingVerifyOrder = null;
        render();
      }
      else if (a === 'set_status') {
        const st = t.dataset.st;
        promptUpdateOrderStatus(id, st);
      }

      // Admin & Modals
      else if (a === 'login') {
        login = true;
        render();
      }
      else if (a === 'closelogin') {
        login = false;
        render();
      }
      else if (a === 'dologin') {
        const val = $('#pw').value;
        const hash = await sha(val);
        // Supports configured hash or fallback 'admin123'
        if (hash === S.pw || val === 'admin123') {
          admin = true;
          login = false;
          adminSubView = 'kitchen';
          try {
            sessionStorage.setItem('sh_admin_session', JSON.stringify({ active: true, user: 'staff', time: Date.now() }));
          } catch(e){}
          render();
        } else {
          $('#lst').textContent = 'Wrong password (try admin123)';
        }
      }
      else if (a === 'logout') {
        admin = false;
        currentView = 'guest';
        try {
          sessionStorage.removeItem('sh_admin_session');
        } catch(e){}
        render();
      }
      else if (a === 'save_all') {
        try {
          localStorage.setItem('shyadri_config', JSON.stringify(S));
          toast('Settings saved successfully ✓');
        } catch(e){}
        admin = false;
        currentView = 'guest';
        render();
      }
      else if (a === 'addnotice') {
        const text = $('#nt').value.trim();
        if (text) {
          S.notices.push({ id: uid(), t: text, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
          try { localStorage.setItem('shyadri_config', JSON.stringify(S)); }catch(e){}
          toast('Notice published ✓');
          render();
        }
      }
      else if (a === 'delnotice') {
        S.notices.splice(i, 1);
        try { localStorage.setItem('shyadri_config', JSON.stringify(S)); }catch(e){}
        render();
      }
      else if (a === 'addcat') {
        S.menu.push({ cat: 'New Category', items: [] });
        mcat = S.menu.length - 1;
        render();
      }
      else if (a === 'delcat') {
        if (confirm('Delete this category?')) {
          S.menu.splice(mcat, 1);
          mcat = 0;
          render();
        }
      }
      else if (a === 'additem') {
        S.menu[mcat].items.push({ id: uid(), n: 'New Dish', p: '100', d: '', v: true, a: true });
        render();
      }
      else if (a === 'delitem') {
        S.menu[mcat].items.splice(j, 1);
        render();
      }
      else if (a === 'addrule') {
        S.rules.push('New house rule');
        render();
      }
      else if (a === 'delrule') {
        S.rules.splice(i, 1);
        render();
      }

      // Fun & Copy
      else if (a === 'copy') {
        try {
          await navigator.clipboard.writeText(t.dataset.v);
          toast('Copied to clipboard ✓');
          boom(t);
        } catch(e) {
          toast('Selection copied');
        }
      }
      else if (a === 'pick') {
        pick(t);
      }
      else if (a === 'owl') {
        const c = $('#car');
        if (c) {
          c.classList.add('fast');
          setTimeout(() => c.classList.remove('fast'), 2000);
        }
        boom($('.sunc'));
      }
    }

    // Parallax mouse tilt
    document.addEventListener('pointermove', e => {
      const h = $('#hero');
      if (!h) return;
      const r = h.getBoundingClientRect();
      h.style.setProperty('--px', Math.max(-.5, Math.min(.5, (e.clientX - r.left) / r.width - .5)).toFixed(3));
    });

    // Auto-poll orders every 10 seconds for live board
    setInterval(() => {
      if (sbClient) fetchSupabaseOrders();
    }, 10000);

    // Initial startup
    initSupabase();
    render();
  </script>
</body>
</html>
